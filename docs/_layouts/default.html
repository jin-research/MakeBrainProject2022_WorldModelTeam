<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --navy: #1f3864;
      --ink: #24292f;
      --rule: #d8dee6;
      --muted: #6a737d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif;
      font-size: 16px;
      line-height: 1.9;
      color: var(--ink);
      background: #fff;
      border-top: 4px solid var(--navy);
    }
    .site-header {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--rule);
    }
    .site-header .site-title {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--navy);
    }
    .site-header .site-title a { color: inherit; text-decoration: none; }
    .site-header .site-desc {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--muted);
    }
    .site-nav {
      margin: 18px 0 2px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }
    .site-nav a {
      display: inline-block;
      padding: 5px 14px;
      font-size: 13.5px;
      color: var(--navy);
      border: 1px solid var(--navy);
      border-radius: 3px;
      text-decoration: none;
      background: #fff;
    }
    .site-nav a:hover { background: var(--navy); color: #fff; }
    .site-nav a svg { vertical-align: -3px; margin-right: 5px; fill: currentColor; }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 8px 24px 48px;
    }
    main.has-hero { padding-top: 0; }
    main.has-hero > .hero:first-child { margin-top: 0; }
    main h1 {
      font-size: 25px;
      color: var(--navy);
      border-bottom: 2px solid var(--navy);
      padding-bottom: 8px;
      margin-top: 1.4em;
    }
    main h2 {
      font-size: 20px;
      color: var(--navy);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 6px;
      margin-top: 2.4em;
    }
    main h3 { font-size: 17px; margin-top: 2em; }
    main h4 { font-size: 16px; margin-top: 1.8em; }
    main img {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--rule);
      border-radius: 3px;
    }
    main a { color: #0b5394; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.1em 0;
      font-size: 14.5px;
    }
    th, td {
      border: 1px solid var(--rule);
      padding: 8px 12px;
      vertical-align: top;
      text-align: left;
    }
    th { background: #f4f6f9; color: var(--navy); }
    blockquote {
      margin: 1.1em 0;
      padding: 2px 18px;
      border-left: 4px solid var(--navy);
      background: #f7f9fc;
      color: #3a3f45;
    }
    pre {
      background: #f6f8fa;
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 12px 14px;
      overflow-x: auto;
      font-size: 13.5px;
      line-height: 1.6;
    }
    code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: .92em; }
    pre.mermaid { background: #fff; text-align: center; }
    ul, ol { padding-left: 1.6em; }
    li { margin: .3em 0; }
    hr { border: none; border-top: 1px solid var(--rule); margin: 2.4em 0; }
    .page-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin: 1.2em 0;
    }
    .page-card {
      display: block;
      border: 1px solid var(--rule);
      border-left: 4px solid var(--navy);
      border-radius: 3px;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--ink);
      background: #fff;
    }
    .page-card:hover { background: #f4f6f9; }
    .page-card strong { color: var(--navy); display: block; margin-bottom: 2px; }
    .page-card span { font-size: 13px; color: var(--muted); line-height: 1.6; display: block; }
    .hero { margin: 18px 0 8px; }
    .hero video {
      display: block; width: 100%; height: auto;
      background: #000; border: 1px solid var(--rule); border-radius: 3px;
    }
    .hero-caption { margin: 10px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
    .hero-title { margin: 24px 0 0; font-size: 26px; font-weight: 700; color: var(--navy);
                  letter-spacing: .04em; text-align: center; text-wrap: balance; }
    .hero-sub { margin: 12px auto 0; max-width: 680px; font-size: 15.5px; line-height: 2; text-align: center; }
    .hero-links { margin: 20px 0 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .hero-links a { display: inline-block; padding: 8px 22px; border: 1px solid var(--navy); border-radius: 3px;
                    color: var(--navy); text-decoration: none; font-size: 14px; }
    .hero-links a:hover { background: var(--navy); color: #fff; }
    @media (max-width: 640px) {
      .hero-title { font-size: 21px; }
    }
    .site-footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 24px 40px;
      border-top: 1px solid var(--rule);
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 640px) {
      body { font-size: 15px; }
      .site-header { padding: 26px 16px 16px; }
      .site-header .site-title { font-size: 24px; }
      main { padding: 4px 16px 40px; }
      table { display: block; overflow-x: auto; white-space: normal; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p class="site-desc">{{ site.description }}</p>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">ホーム</a>
      <a href="{{ '/RESULTS' | relative_url }}">成果</a>
      <a href="{{ '/ABOUT' | relative_url }}">プロジェクトについて</a>
      <a href="{{ '/ABOUT_appendix' | relative_url }}">経緯</a>
      <a href="{{ '/SETUP' | relative_url }}">環境・実行記録</a>
      <a href="https://github.com/jin-research/MakeBrainProject2022_WorldModelTeam"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>GitHub</a>
    </nav>
  </header>
  <main{% if page.url == '/' %} class="has-hero"{% endif %}>
{{ content }}
  </main>
  <footer class="site-footer">
    公立はこだて未来大学 2022年度「脳をつくるプロジェクト」グループA（22-A）世界モデルカー
  </footer>
  <script type="module">
    // Mermaid のコードブロックを図として描画する。
    // kramdown は <div class="language-mermaid">、GitHub.com は <pre><code class="language-mermaid"> を出す。
    // どちらの形でも拾い、同じブロックを二重に数えないようにする。
    const seen = new Set();
    const blocks = [];
    document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
      const host = el.closest("div.language-mermaid") || el.closest("pre") || el;
      if (seen.has(host)) return;
      seen.add(host);
      blocks.push({ host, code: el.textContent });
    });
    if (blocks.length) {
      const mermaid = (await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs")).default;
      blocks.forEach(({ host, code }) => {
        const diagram = document.createElement("pre");
        diagram.className = "mermaid";
        diagram.textContent = code;
        host.replaceWith(diagram);
      });
      mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "loose" });
      await mermaid.run({ querySelector: "pre.mermaid" });
    }
  </script>
</body>
</html>
